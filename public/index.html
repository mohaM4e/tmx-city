<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMX Gotham</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Limelight&display=swap" rel="stylesheet">
<style>
  :root { --brass:#c9a24a; --amber:#ffcf7a; --fog:#8b97ab; --text:#e9edf5;
    --cut: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#131a26; color:var(--text); font:400 14px/1.45 "Josefin Sans",system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; }
  .panel { position:relative; padding:1px; background:var(--brass); clip-path:var(--cut); flex:none; }
  .panel > .in { background:rgba(13,17,25,.9); clip-path:var(--cut); padding:14px 16px; }
  #left { position:fixed; top:16px; left:16px; width:min(330px,calc(100vw - 32px)); display:flex; flex-direction:column; gap:10px;
    max-height:calc(100vh - 32px); overflow-y:auto; scrollbar-width:thin; }
  #card, #notice { position:fixed; }
  h1 { margin:0; font:400 30px/1.05 Limelight,serif; letter-spacing:.03em; color:var(--amber); }
  #status { margin:4px 0 10px; color:var(--fog); }
  #perf { margin:8px 0 0; color:var(--fog); font-size:12px; }
  input[type=search], select { width:100%; padding:8px 10px; border:1px solid rgba(201,162,74,.5); background:rgba(255,255,255,.06);
    color:var(--text); font:inherit; border-radius:2px; }
  select option { background:#10151f; }
  input::placeholder { color:var(--fog); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .btn { padding:6px 10px; font:600 13px "Josefin Sans",sans-serif; color:var(--text); background:transparent;
    border:1px solid rgba(201,162,74,.55); border-radius:2px; cursor:pointer; }
  .btn:hover { background:rgba(201,162,74,.2); }
  .btn[aria-pressed="true"] { background:rgba(201,162,74,.28); color:var(--amber); border-color:var(--brass); }
  details { margin:0; } details + details { margin-top:8px; border-top:1px solid rgba(201,162,74,.25); padding-top:8px; }
  summary { cursor:pointer; font:400 18px Limelight,serif; color:var(--amber); }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin:9px 0 0; }
  .row input[type=range] { grid-column:1 / -1; width:100%; accent-color:var(--brass); }
  .row .v { color:var(--amber); }
  .check { display:flex; gap:8px; align-items:center; margin:9px 0 0; }
  .legend { margin:8px 0 0; padding:0; list-style:none; color:var(--fog); }
  .legend li { margin-top:3px; } .legend b { color:var(--amber); font-weight:600; }
  .hint { color:var(--fog); font-size:12px; margin:8px 0 0; }
  #card { right:16px; bottom:16px; width:min(290px,calc(100vw - 32px)); display:none; }
  #card h2 { margin:0 0 6px; font:400 24px/1.1 Limelight,serif; color:var(--amber); word-break:break-word; }
  #card dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 14px; }
  #card dt { color:var(--fog); } #card dd { margin:0; text-align:right; }
  #card a { color:var(--amber); display:inline-block; margin-top:8px; }
  #tip { position:fixed; pointer-events:none; padding:4px 8px; display:none; white-space:nowrap; background:rgba(13,17,25,.92); border:1px solid var(--brass); }
  #notice { top:16px; right:16px; max-width:290px; display:none; color:var(--amber); }
  :focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="left">
  <section class="panel"><div class="in">
    <h1>TMX Gotham</h1>
    <p id="status">Building the city…</p>
    <input id="search" type="search" placeholder="Find a player, press Enter" aria-label="Find a player">
    <div class="btns"><button class="btn" id="tSettings" aria-pressed="true">Settings</button></div>
    <p id="perf"></p>
    <details style="margin-top:8px"><summary>Reading the city</summary><ul class="legend">
      <li><b>Height</b> follows maps uploaded</li>
      <li><b>Gold trim</b> grows with awards received</li>
      <li><b>Spire</b> 1+ awards, <b>lantern</b> 10+, <b>beacon</b> 50+</li>
      <li><b>Downtown</b> is the top of whichever order you pick</li>
    </ul></details>
  </div></section>
  <section class="panel" id="settings"><div class="in" id="settingsBody"></div></section>
</div>
<section id="notice" class="panel"><div class="in">No users.json found, showing demo data. Run <code>npm run fetch</code> first.</div></section>
<section id="card" class="panel"><div class="in" id="cardBody"></div></section>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const LOT = 3.2;       // world size of one lot
const CH = 24;         // lots per chunk side (~77 units): the unit of culling
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mod = (n, m) => ((n % m) + m) % m;
const hash = (i) => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

// ============================ data ============================
async function loadUsers() {
  try {
    const r = await fetch('users.json'); if (!r.ok) throw new Error();
    const d = await r.json(); if (!Array.isArray(d) || !d.length) throw new Error();
    return { users: d, demo: false };
  } catch { return { users: demoUsers(), demo: true }; }
}
function demoUsers() {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 30000 }, (_, i) => {
    const maps = rnd() < 0.7 ? 0 : Math.floor(Math.pow(rnd(), 6) * 800);
    return { UserId: i + 1, Name: 'Demo' + (i + 1), MapCount: maps,
      AwardsReceivedCount: Math.floor(Math.pow(rnd(), 8) * maps * 0.6), RegisteredAt: new Date(1.5e12 + i * 8e6).toISOString() };
  });
}
const { users: allUsers, demo } = await loadUsers();
if (demo) $('notice').style.display = 'block';
await new Promise((r) => requestAnimationFrame(r));

// ============================ settings ============================
const LEVELS = [
  { res: 0.50, view: 240, rain: 0,    glow: 0,    win: 0 },
  { res: 0.60, view: 300, rain: 0,    glow: 0,    win: 90 },
  { res: 0.75, view: 380, rain: 0,    glow: 0,    win: 140 },
  { res: 0.90, view: 460, rain: 1500, glow: 0,    win: 200 },
  { res: 1.00, view: 560, rain: 3000, glow: 0.45, win: 260 },
  { res: 1.25, view: 700, rain: 4500, glow: 0.60, win: 320 },
  { res: 1.50, view: 850, rain: 6000, glow: 0.80, win: 380 },
];
const gfx = { auto: true, level: 3, res: 0.9, view: 460, fogMul: 1, rain: 1500, glow: 0, win: 200, lightning: true };
const state = { order: 'maps', topN: allUsers.length, minMaps: 0, minAwards: 0, hScale: 1, speed: 80 };
try {
  const s = JSON.parse(localStorage.getItem('tmxGotham') || 'null');
  if (s) { Object.assign(gfx, s.gfx || {}); Object.assign(state, s.state || {}); }
} catch { /* storage unavailable */ }
state.topN = Math.min(state.topN || allUsers.length, allUsers.length);
const save = () => { try { localStorage.setItem('tmxGotham', JSON.stringify({ gfx, state })); } catch { /* ignore */ } };

// ============================ renderer / shared uniforms ============================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 3500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 6; controls.maxDistance = 1500;

const baseFog = new THREE.Color().setRGB(0.075, 0.10, 0.15), fogCol = baseFog.clone();
const moonDir = new THREE.Vector3(-0.55, 0.4, -0.65).normalize();
const rimDir = new THREE.Vector3(0.7, 0.25, 0.55).normalize();
const SH = {
  uTime: { value: 0 }, uFlash: { value: 0 }, uFog: { value: fogCol }, uFogD: { value: 0.004 },
  uWinDist: { value: 200 }, uDetail: { value: 1 },
  uMoonDir: { value: moonDir }, uMoonCol: { value: new THREE.Color(1.1, 1.4, 2.4) },
  uRimDir: { value: rimDir }, uRimCol: { value: new THREE.Color(1.3, 0.8, 0.4) },
  uHemiSky: { value: new THREE.Color(0.35, 0.45, 0.75) }, uHemiGround: { value: new THREE.Color(0.07, 0.07, 0.10) },
};

// optional glow (bloom) - only created if the glow slider is above zero
let composer = null, bloom = null;
function ensureComposer() {
  if (composer) return;
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }));
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 0.6);
  composer.addPass(bloom); composer.addPass(new OutputPass());
  composer.setPixelRatio(gfx.res); composer.setSize(innerWidth, innerHeight);
}
function setRes(r) {
  renderer.setPixelRatio(r); renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(r); composer.setSize(innerWidth, innerHeight); }
}

// ============================ shaders ============================
const BODY_VS = `
attribute vec3 aPos; attribute vec3 aSize; attribute vec3 aCol; attribute vec2 aMeta;
uniform vec3 uMoonDir, uMoonCol, uRimDir, uRimCol, uHemiSky, uHemiGround; uniform float uFlash;
varying vec3 vWP; varying vec3 vN; varying vec3 vCol; varying vec3 vLight; varying vec2 vMeta;
varying float vH; varying float vLocalY; varying float vSeed;
void main(){
  vec3 wp = aPos + position * aSize;
  vWP = wp; vN = normal; vCol = aCol; vMeta = aMeta; vH = aSize.y; vLocalY = position.y;
  vSeed = fract(sin(dot(aPos.xz, vec2(12.9898, 78.233))) * 43758.5453);
  vec3 hemi = mix(uHemiGround, uHemiSky, normal.y * 0.5 + 0.5) * (1.0 + uFlash * 5.0);
  vLight = hemi + uMoonCol * max(dot(normal, uMoonDir), 0.0) + uRimCol * max(dot(normal, uRimDir), 0.0);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}`;
const BODY_FS = `
uniform vec3 uFog; uniform float uFogD, uTime, uWinDist, uDetail;
varying vec3 vWP; varying vec3 vN; varying vec3 vCol; varying vec3 vLight; varying vec2 vMeta;
varying float vH; varying float vLocalY; varying float vSeed;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  float dist = length(vWP - cameraPosition);
  vec3 col = vCol * vLight;
  vec3 emi = vec3(0.0);
  if (vMeta.y > 1.5) {                     // beacon
    col = vec3(0.0);
    emi = vec3(1.6, 1.1, 0.45) * (1.4 + 0.6 * sin(uTime * 2.2 + vSeed * 6.28));
  } else if (vMeta.y > 0.5) {              // spire
    col = vec3(0.9, 0.95, 1.1) * vLight * 0.35;
  } else if (abs(vN.y) < 0.5) {            // facade
    bool fx = abs(vN.x) > 0.5;
    float hc = fx ? vWP.z : vWP.x;
    float lh = vLocalY * vH;
    float bandH = min(0.8, vH * 0.5);
    float fr = uDetail > 0.5 ? smoothstep(uWinDist * 0.45, uWinDist, dist) : 1.0;
    float band = step(vH - bandH, lh);
    vec3 brass = mix(vec3(0.30, 0.30, 0.34), vec3(0.95, 0.72, 0.26), vMeta.x);
    vec3 farGlow = vec3(1.0, 0.74, 0.40) * 0.085 * (1.0 - 0.5 * vSeed);
    if (fr < 0.999) {
      vec2 g = vec2(hc / 1.9, vWP.y / 1.45);
      vec2 id = floor(g) + (fx ? vec2(0.0) : vec2(41.0, 13.0));
      vec2 f = fract(g);
      float pil = 1.0 - step(0.2, f.x);
      float win = step(0.32, f.x) * step(f.x, 0.9) * step(0.16, f.y) * step(f.y, 0.84) * step(1.3, lh) * step(lh, vH - bandH - 0.2);
      float lit = step(0.25 + 0.45 * vSeed, h21(id + vSeed * 91.0)) * win;
      vec3 wc = mix(vec3(1.0, 0.76, 0.40), vec3(0.72, 0.86, 1.0), step(0.88, h21(id + 7.0)));
      float bs = 1.0 - step(1.1, lh);
      float shop = bs * step(0.5, h21(id + 3.0));
      col *= (1.0 + 0.16 * pil) * (1.0 - 0.45 * win * (1.0 - lit)) * (1.0 - 0.35 * bs);
      emi += mix(wc * lit * 0.95 + vec3(1.0, 0.7, 0.35) * shop * 0.3, farGlow, fr);
    } else { emi += farGlow; }
    col = mix(col, brass * vLight * 2.0, band);
    emi += brass * vMeta.x * band * 0.55 * (1.0 - 0.5 * fr);
  } else if (vN.y > 0.5) { col *= 0.7; }
  float fog = 1.0 - exp(-uFogD * uFogD * dist * dist);
  gl_FragColor = vec4(mix(col + emi, uFog, fog), 1.0);
  #include <colorspace_fragment>
}`;
const GROUND_VS = `varying vec3 vWP; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const GROUND_FS = `
uniform vec3 uFog, uMoonDir, uMoonCol, uRimDir, uRimCol, uHemiSky; uniform float uFogD, uFlash;
varying vec3 vWP;
void main(){
  vec2 gc = vWP.xz / ${LOT.toFixed(3)} + 0.5; vec2 cell = floor(gc); vec2 fc = fract(gc);
  float sx = step(3.5, mod(cell.x, 5.0)); float sy = step(3.5, mod(cell.y, 5.0));
  float street = max(sx, sy);
  float dist = length(vWP - cameraPosition);
  float nr = 1.0 - smoothstep(110.0, 360.0, dist);
  float edge = min(min(fc.x, 1.0 - fc.x), min(fc.y, 1.0 - fc.y));
  vec3 slab = vec3(0.040, 0.045, 0.056) * (1.0 + 0.7 * smoothstep(0.07, 0.0, edge) * nr);
  vec3 alb = mix(slab, vec3(0.010, 0.012, 0.018), street);
  float laneV = sx * (1.0 - sy) * step(abs(fc.x - 0.5), 0.025) * step(0.5, fract(vWP.z / 1.6));
  float laneH = sy * (1.0 - sx) * step(abs(fc.y - 0.5), 0.025) * step(0.5, fract(vWP.x / 1.6));
  alb += vec3(0.30, 0.24, 0.10) * (laneV + laneH) * nr;
  vec3 L = (uHemiSky * 0.6 + uMoonCol * uMoonDir.y * 0.7 + uRimCol * uRimDir.y * 0.4) * (1.0 + uFlash * 4.0);
  vec3 col = alb * L;
  vec3 v = normalize(cameraPosition - vWP);
  vec3 r = vec3(-v.x, v.y, -v.z);
  col += (pow(max(dot(r, uMoonDir), 0.0), 40.0) * 0.35 * uMoonCol + pow(max(dot(r, uRimDir), 0.0), 30.0) * 0.25 * uRimCol) * street * nr;
  col += vec3(1.0, 0.70, 0.36) * exp(-length(fc - 0.5) * 9.0) * street * 0.42 * nr;
  float fog = 1.0 - exp(-uFogD * uFogD * dist * dist);
  gl_FragColor = vec4(mix(col, uFog, fog), 1.0);
  #include <colorspace_fragment>
}`;

const bodyMat = new THREE.ShaderMaterial({ uniforms: SH, vertexShader: BODY_VS, fragmentShader: BODY_FS });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.ShaderMaterial({ uniforms: SH, vertexShader: GROUND_VS, fragmentShader: GROUND_FS }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// sky: drawn last so pixels covered by buildings are rejected by the depth test before the cloud shader runs
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: SH.uTime, uFlash: SH.uFlash, uHorizon: { value: fogCol }, uMoon: { value: moonDir } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform float uTime, uFlash; uniform vec3 uHorizon, uMoon;
    float hs(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hs(i),hs(i+vec2(1,0)),f.x), mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x), f.y); }
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(uHorizon, vec3(0.010,0.015,0.028), pow(h, 0.45));
      float md = max(dot(d, uMoon), 0.0);
      float c = 0.0;
      if (d.y > 0.0) {
        vec2 uv = d.xz / (d.y + 0.22) * 1.8 + vec2(uTime*0.012, uTime*0.006);
        c = smoothstep(0.38, 0.85, 0.55*vn(uv) + 0.30*vn(uv*2.03) + 0.15*vn(uv*4.1));
      }
      vec3 cloud = mix(vec3(0.025,0.035,0.055), vec3(0.30,0.36,0.47), pow(md, 5.0)) + uHorizon*0.5;
      col = mix(col, cloud, c * smoothstep(0.0, 0.18, d.y) * 0.92);
      col += vec3(0.75,0.85,1.0) * pow(md, 600.0) * 1.6 + vec3(0.22,0.30,0.50) * pow(md, 14.0) * 0.28;
      col += uFlash * vec3(0.45,0.5,0.7) * (0.25 + c);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = 999; sky.frustumCulled = false; scene.add(sky);

// ============================ bat signal (generic bat silhouette on the clouds) ============================
const BEAM = 420;
const beamDir = new THREE.Vector3(-0.9, 1.0, 0.1).normalize();
const lampMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 1.4, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.8, 1.7, 1.4) }));
const beam = new THREE.Mesh(new THREE.CylinderGeometry(24, 1.2, BEAM, 28, 1, true).translate(0, BEAM / 2, 0), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  vertexShader: `varying float vY; varying float vF; void main(){ vY = position.y / ${BEAM}.0;
    vec3 n = normalize(normalMatrix * normal); vec3 v = normalize(-(modelViewMatrix * vec4(position,1.0)).xyz);
    vF = pow(abs(dot(n, v)), 1.4); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying float vY; varying float vF; void main(){
    float a = pow(1.0 - vY, 1.3) * 0.30 * vF; gl_FragColor = vec4(vec3(0.80, 0.88, 1.0) * a, 1.0); #include <colorspace_fragment> }`,
}));
beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), beamDir);
const cv = document.createElement('canvas'); cv.width = cv.height = 512;
{
  const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512);
  const rg = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, 'rgba(255,246,220,0.95)'); rg.addColorStop(0.62, 'rgba(255,238,200,0.85)');
  rg.addColorStop(0.9, 'rgba(255,230,190,0.15)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
  const Rt = [[0,-8],[4.5,-22],[8.5,-9.5],[24,-13],[46,-20],[62,-10],[54,-4],[46,-1],[40,6],[32,2],[24,9],[16,6],[10,16],[5,9],[0,13]];
  const s = 2.0, cx = 256, cy = 262;
  g.beginPath(); g.moveTo(cx + Rt[0][0] * s, cy + Rt[0][1] * s);
  for (const [x, y] of Rt) g.lineTo(cx + x * s, cy + y * s);
  for (let k = Rt.length - 2; k >= 0; k--) g.lineTo(cx - Rt[k][0] * s, cy + Rt[k][1] * s);
  g.closePath(); g.fillStyle = '#000'; g.fill();
}
const sigTex = new THREE.CanvasTexture(cv); sigTex.colorSpace = THREE.SRGBColorSpace;
const disc = new THREE.Mesh(new THREE.PlaneGeometry(190, 190), new THREE.MeshBasicMaterial({
  map: sigTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.85 }));
const sigGroup = new THREE.Group(); sigGroup.add(lampMesh, beam, disc); scene.add(sigGroup);

// ============================ rain (GPU-animated lines; draw range = amount) ============================
const RAIN_MAX = 8000, BOX = 220;
const rp = new Float32Array(RAIN_MAX * 6), re = new Float32Array(RAIN_MAX * 2);
for (let i = 0; i < RAIN_MAX; i++) {
  const x = Math.random() * BOX, y = Math.random() * 90, z = Math.random() * BOX;
  rp.set([x, y, z, x, y, z], i * 6); re[i * 2 + 1] = 1;
}
const rg2 = new THREE.BufferGeometry();
rg2.setAttribute('position', new THREE.BufferAttribute(rp, 3)); rg2.setAttribute('aEnd', new THREE.BufferAttribute(re, 1));
const rainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uTime: SH.uTime, uCam: { value: camera.position } },
  vertexShader: `attribute float aEnd; uniform float uTime; uniform vec3 uCam; varying float vA;
    void main(){ float S = ${BOX}.0; vec3 p = position;

  if (nAcc < 24) return;
  const avg = accMs / nAcc; accMs = 0; nAcc = 0; fps = 1000 / avg;
  $('perf').textContent = `${Math.round(fps)} fps · ${Math.round(gfx.res * 100)}% res · ${drawn} of ${chunkList.length} blocks drawn${gfx.auto ? ' · auto' : ''}`;
  if (!gfx.auto) return;
  if (t > ceilUntil) ceiling = 6;
  if (avg > 24 && gfx.level > 0) { ceiling = gfx.level - 1; ceilUntil = t + 25; applyLevel(gfx.level - 1); settle = 0.6; good = 0; }
  else if (avg < 17.5 && gfx.level < ceiling) { if (++good >= 5) { good = 0; applyLevel(gfx.level + 1); settle = 0.6; } }
  else good = 0;
});
</script>
</body>
</html>
